<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Waste Segregation Image Classifier</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <!-- Teachable Machine image library -->
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Poppins", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: radial-gradient(circle at top, #4fd1c5, #2b6cb0);
            color: #1a202c;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 20px;
            padding: 20px 18px 24px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.18);
        }
        .title-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .logo-circle {
            width: 46px;
            height: 46px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg,#48bb78,#38b2ac);
            color: #fff;
            font-size: 22px;
        }
        h1 {
            font-size: 20px;
            margin: 0;
        }
        .subtitle {
            font-size: 13px;
            color: #4a5568;
            margin-bottom: 16px;
        }
        .status-badges {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 999px;
            background: #edf2f7;
            color: #2d3748;
        }
        #start-button {
            width: 100%;
            padding: 10px 16px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg,#3182ce,#2b6cb0);
            color: #ffffff;
            margin-bottom: 12px;
            transition: transform 0.1s ease, box-shadow 0.1s ease, opacity 0.1s;
            box-shadow: 0 8px 20px rgba(45,114,179,0.4);
        }
        #start-button:active {
            transform: translateY(1px);
            box-shadow: 0 4px 10px rgba(45,114,179,0.4);
        }
        #webcam-container {
            border-radius: 16px;
            overflow: hidden;
            background: #e2e8f0;
            margin-bottom: 10px;
        }
        #webcam-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }
        #label-container div {
            font-size: 13px;
            margin-top: 2px;
            color: #4a5568;
            text-align: left;
        }
        #label-container {
            background: #f7fafc;
            border-radius: 12px;
            padding: 8px 10px;
            margin-bottom: 10px;
        }
        #result-message {
            margin-top: 2px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
        }
        #result-message span {
            font-weight: 700;
        }
        #error {
            margin-top: 6px;
            color: #e53e3e;
            font-size: 12px;
            min-height: 16px;
        }
        .bins-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 6px;
            font-size: 11px;
            color: #4a5568;
        }
        .bin {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 999px;
            background: #edf2f7;
        }
        .footer {
            margin-top: 10px;
            font-size: 11px;
            color: #a0aec0;
            text-align: center;
        }

        @media (max-width: 480px) {
            .card {
                padding: 16px 14px 20px;
                border-radius: 18px;
            }
            h1 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="title-row">
        <div class="logo-circle">♻</div>
        <div>
            <h1>Waste Segregation AI</h1>
            <div class="subtitle">Show any item to the camera. The system will tell if it is Paper or Plastic.</div>
        </div>
    </div>

    <div class="status-badges">
        <div class="badge">Real-time Camera</div>
        <div class="badge">Teachable Machine</div>
        <div class="badge">Student Project</div>
    </div>

    <button id="start-button" onclick="init()">Start Camera & Classifier</button>

    <div id="webcam-container"></div>
    <div id="label-container"></div>
    <div id="result-message"></div>

    <div class="bins-row">
        <div class="bin">🟦 Paper Bin</div>
        <div class="bin">🟨 Plastic Bin</div>
    </div>

    <div id="error"></div>

    <div class="footer">
        Powered by Teachable Machine & TensorFlow.js
    </div>
</div>

<script type="text/javascript">
    const URL = "https://teachablemachine.withgoogle.com/models/vpWoi6tny/";

    let model, webcam, labelContainer, maxPredictions;

    async function init() {
        const btn = document.getElementById("start-button");
        const errDiv = document.getElementById("error");
        errDiv.innerHTML = "";
        btn.disabled = true;
        btn.style.opacity = "0.8";
        btn.innerText = "Loading model...";

        try {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const flip = true;
            webcam = new tmImage.Webcam(300, 300, flip);
            await webcam.setup();
            await webcam.play();
            window.requestAnimationFrame(loop);

            document.getElementById("webcam-container").appendChild(webcam.canvas);
            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = "";
            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }

            btn.innerText = "Camera Running";
        } catch (e) {
            console.error(e);
            errDiv.innerHTML = "Error: " + e;
            btn.disabled = false;
            btn.style.opacity = "1";
            btn.innerText = "Start Camera & Classifier";
        }
    }

    async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        let bestClass = "";
        let bestProb = 0;

        for (let i = 0; i < maxPredictions; i++) {
            const className = prediction[i].className;
            const prob = prediction[i].probability;
            const percent = (prob * 100).toFixed(1) + "%";

            labelContainer.childNodes[i].innerHTML = className + ": " + percent;

            if (prob > bestProb) {
                bestProb = prob;
                bestClass = className;
            }
        }

        const messageDiv = document.getElementById("result-message");

        if (bestProb < 0.6) {
            messageDiv.innerHTML = "Not sure… hold the item closer to the camera.";
        } else if (bestClass.toLowerCase() === "paper") {
            messageDiv.innerHTML = "Detected: <span>PAPER</span> – Put in <span>BLUE Paper Bin</span>.";
        } else if (bestClass.toLowerCase() === "plastic") {
            messageDiv.innerHTML = "Detected: <span>PLASTIC</span> – Put in <span>YELLOW Plastic Bin</span>.";
        } else {
            messageDiv.innerHTML = "Detected: <span>" + bestClass + "</span>";
        }
    }
</script>
</body>
</html>
